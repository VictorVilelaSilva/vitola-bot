services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: vitola-bot:latest
    container_name: vitola-bot
    env_file:
      - .env
    # O bot encerra a reprodução e fecha a sessão HTTP no SIGTERM (ver
    # docs/architecture.md); 60s dão folga para isso antes do SIGKILL.
    stop_grace_period: 60s
    restart: unless-stopped
    # Webhook de lives: o LiveKit do fckjj roda na mesma VPS (network_mode: host)
    # e entrega em 127.0.0.1:8026. Porta publicada pelo Docker fura o firewall
    # da VPS, então o bind em 127.0.0.1 é o que mantém o endpoint fora da internet.
    ports:
      - "127.0.0.1:8026:8026"
