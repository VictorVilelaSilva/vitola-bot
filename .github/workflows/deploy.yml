name: Deploy Vitola Bot to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: SSH to VPS & Deploy
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            APP_DIR="$HOME/projects/vitola-bot"
            REPO_URL="https://github.com/VictorVilelaSilva/vitola-bot.git"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # A pasta já existe no VPS com o .env, então inicializamos o git
            # dentro dela em vez de clonar por cima.
            if [ ! -d .git ]; then
              git init -b main
              git remote add origin "$REPO_URL"
            fi

            git fetch --depth 1 origin main
            # .env e src/assets/tempAudios estão no .gitignore: reset e clean
            # (sem -x) não os removem.
            git reset --hard FETCH_HEAD
            git clean -fd

            if [ ! -f .env ]; then
              echo "ERRO: $APP_DIR/.env nao encontrado no VPS." >&2
              exit 1
            fi
            chmod 600 .env

            # Container do deploy antigo (docker run a partir do Docker Hub)
            # não tem labels do compose e ocuparia o nome vitola-bot.
            LEGACY=$(docker ps -aq --filter "name=^vitola-bot$")
            if [ -n "$LEGACY" ] && \
               [ -z "$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$LEGACY")" ]; then
              echo "Removendo container legado vitola-bot..."
              docker rm -f "$LEGACY"
            fi

            docker compose up -d --build
            docker image prune -f
            docker compose ps
